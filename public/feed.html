<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية | Koliya Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a08; --card: #0e0e0b; --gold: #c9a84c; --text: #f5f0e8; --border: rgba(201, 168, 76, 0.15); }
        body { background: var(--bg); color: var(--text); font-family: 'Amiri', serif; margin: 0; padding-bottom: 70px; }
        
        /* Navbar */
        .nav { background: var(--card); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav h2 { color: var(--gold); margin: 0; font-size: 1.4rem; }
        .nav-icons { display: flex; gap: 20px; }
        .nav-icons span { cursor: pointer; font-size: 1.2rem; }

        /* Post Creation */
        .create-post { background: var(--card); margin: 15px; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        textarea { width: 100%; background: #131310; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; resize: none; font-family: 'Amiri'; box-sizing: border-box; }
        .post-btn { background: var(--gold); color: #000; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; float: left; }

        /* Feed List */
        .feed-container { padding: 10px; }
        .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; animation: fadeIn 0.4s ease; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
        .post-header b { color: var(--gold); }
        .post-content { line-height: 1.6; font-size: 1.05rem; }
        .post-time { font-size: 0.75rem; color: #777; margin-top: 10px; display: block; }

        /* Bottom Nav */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px; }
        .bottom-bar span { cursor: pointer; font-weight: bold; color: var(--gold); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="nav">
        <h2>Koliya</h2>
        <div class="nav-icons">
            <span onclick="location.href='inbox.html'">✉️</span>
            <span onclick="location.href='admin.html'">⚙️</span>
        </div>
    </div>

    <div class="create-post">
        <textarea id="postText" rows="3" placeholder="بماذا تفكر يا ${JSON.parse(localStorage.getItem('userData'))?.name.split(' ')[0]}؟"></textarea>
        <button class="post-btn" onclick="sendPost()">نشر</button>
        <div style="clear:both"></div>
    </div>

    <div class="feed-container" id="feed">
        </div>

    <div class="bottom-bar">
        <span onclick="location.reload()">🏠 الرئيسية</span>
        <span onclick="location.href='profile.html?u='+myData.user">👤 ملفي</span>
    </div>

<script>
    const myData = JSON.parse(localStorage.getItem('userData'));
    if (!myData) window.location.href = 'index.html';

    async function fetchPosts() {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const feed = document.getElementById('feed');
        
        feed.innerHTML = posts.map(p => `
            <div class="post-card">
                <div class="post-header" onclick="location.href='profile.html?u=${p.author}'">
                    <b>@${p.author}</b>
                </div>
                <div class="post-content">${p.content}</div>
                <span class="post-time">${new Date(p.id).toLocaleString('ar-DZ')}</span>
            </div>
        `).join('');
    }

    async function sendPost() {
        const text = document.getElementById('postText').value.trim();
        if(!text) return;

        const res = await fetch('/api/posts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ author: myData.user, content: text })
        });

        if(res.ok) {
            document.getElementById('postText').value = '';
            fetchPosts();
        }
    }

    // Load feed
    fetchPosts();
    // Sync posts every 15 seconds
    setInterval(fetchPosts, 15000);
</script>
</body>
</html>
