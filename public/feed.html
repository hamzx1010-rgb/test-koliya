<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; padding-bottom: 70px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.5rem; color: var(--gold); font-weight: bold; }
    
    .timer-card { background: linear-gradient(135deg, #1a1a17, #0e0e0b); margin: 15px; padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .timer-val { font-family: 'Space Mono', monospace; font-size: 2.5rem; color: var(--gold); display: block; margin: 10px 0; }
    
    .create-post { background: var(--bg2); padding: 15px; margin: 15px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 10px; }
    .create-post input { flex: 1; background: transparent; border: none; color: #fff; font-family: 'Amiri'; outline: none; font-size: 1rem; }
    .btn-post { background: var(--gold); color: #000; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    .feed { padding: 0 15px; }
    .post { background: var(--bg2); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--gold); }
    .post-content { line-height: 1.5; font-size: 1.1rem; }

    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--bg2); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-link { text-decoration: none; color: #888; text-align: center; font-size: 1.2rem; }
    .nav-link.active { color: var(--gold); }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">كلية</div>
  <div>🔔</div>
</div>

<div class="timer-card">
  <div>الوقت المتبقي لحافلة <span id="busWilaya">الجامعة</span></div>
  <div class="timer-val" id="busTimer">15:00</div>
  <div style="font-size: 0.8rem; color: #888;">يتم التحديث تلقائياً</div>
</div>

<div class="create-post">
  <input type="text" id="postTxt" placeholder="ماذا يحدث في الجامعة؟">
  <button class="btn-post" onclick="publish()">نشر</button>
</div>

<div class="feed" id="posts">
  <div style="text-align:center; padding:20px; color:#555;">جاري تحميل المنشورات...</div>
</div>

<nav class="bottom-nav">
  <a href="feed.html" class="nav-link active">🏠</a>
  <a href="inbox.html" class="nav-link">🔔</a>
  <a href="chat.html" class="nav-link">💬</a>
  <a href="profile.html" class="nav-link">👤</a>
</nav>

<script>
    const user = JSON.parse(localStorage.getItem('user')) || JSON.parse(localStorage.getItem('userData'));
    if (!user) {
        window.location.href = 'index.html';
    }

    if (user && user.wilaya) {
        document.getElementById('busWilaya').innerText = user.wilaya;
    }

    async function loadFeed() {
        try {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const container = document.getElementById('posts');
            
            if (posts.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#555;">لا توجد منشورات. كن أول من ينشر!</div>';
                return;
            }
            
            container.innerHTML = posts.map(p => `
                <div class="post">
                    <div class="post-header">
                        <b>${p.author}</b> <span style="font-size:0.8rem; color:#888;">${new Date(p.date || p.timestamp).toLocaleTimeString('ar-DZ')}</span>
                    </div>
                    <div class="post-content">${p.content || p.text}</div>
                </div>
            `).join('');
        } catch (e) {
            console.error("Error loading feed:", e);
        }
    }

    async function publish() {
        const text = document.getElementById('postTxt').value;
        if (!text.trim()) return;
        
        await fetch('/api/posts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ author: user.name || user.user, content: text, text: text })
        });
        
        document.getElementById('postTxt').value = '';
        loadFeed();
    }

    // Bus Timer Logic
    setInterval(() => {
        const timer = document.getElementById('busTimer');
        let [m, s] = timer.innerText.split(':').map(Number);
        if (s === 0) { 
            m = m === 0 ? 15 : m - 1; 
            s = 59; 
        } else { 
            s--; 
        }
        timer.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }, 1000);

    loadFeed();
</script>
</body>
</html>
