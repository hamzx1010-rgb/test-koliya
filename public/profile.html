<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Koliya</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --panel: #0e0e0b; --gold: #c9a84c; --text: #f5f0e8; --border: rgba(201, 168, 76, 0.2); }
        body { background: var(--bg); color: var(--text); font-family: 'Amiri', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .profile-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .avatar { width: 100px; height: 100px; background: var(--gold); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #000; font-weight: bold; }
        
        h1 { margin: 10px 0 5px; color: var(--text); }
        .username { color: var(--gold); font-size: 1.1rem; margin-bottom: 25px; display: block; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; text-align: right; border-top: 1px solid var(--border); padding-top: 20px; }
        .info-item label { font-size: 0.8rem; color: #777; display: block; }
        .info-item span { font-size: 1rem; color: var(--text); }

        .actions { display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 12px; border-radius: 8px; border: none; font-family: 'Amiri'; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-msg { background: var(--gold); color: #000; }
        .btn-privacy { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-back { background: transparent; color: #777; margin-top: 10px; }
        
        .private-notice { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="profile-card" id="profileContent">
        </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUser = urlParams.get('u');
    const myData = JSON.parse(localStorage.getItem('userData'));

    async function loadProfile() {
        const res = await fetch(`/api/user/${targetUser}`);
        if (!res.ok) {
            document.getElementById('profileContent').innerHTML = "<h1>المستخدم غير موجود</h1>";
            return;
        }
        const user = await res.json();
        const isOwner = (myData.user === user.user);
        const isPrivate = (user.privacy === 'private');

        let html = `
            <div class="avatar">${user.name[0]}</div>
            <h1>${user.name}</h1>
            <span class="username">@${user.user}</span>
        `;

        if (isPrivate && !isOwner) {
            html += `
                <div class="private-notice">هذا الحساب خاص. لا يمكنك رؤية التفاصيل أو مراسلته.</div>
                <button class="btn btn-back" onclick="history.back()">العودة</button>
            `;
        } else {
            html += `
                <div class="info-grid">
                    <div class="info-item"><label>الولاية</label><span>${user.wilaya}</span></div>
                    <div class="info-item"><label>الحالة</label><span>${user.status === 'active' ? 'نشط' : 'معلق'}</span></div>
                </div>
                <div class="actions">
                    ${!isOwner ? `<button class="btn btn-msg" onclick="location.href='chat.html?with=${user.user}'">إرسال رسالة ✉️</button>` : ''}
                    ${isOwner ? `<button class="btn btn-privacy" onclick="togglePrivacy('${user.privacy}')">
                        تحويل الحساب إلى ${isPrivate ? 'عام 🌍' : 'خاص 🔒'}
                    </button>` : ''}
                    <button class="btn btn-back" onclick="location.href='feed.html'">العودة للرئيسية</button>
                </div>
            `;
        }
        document.getElementById('profileContent').innerHTML = html;
    }

    async function togglePrivacy(current) {
        const newPrivacy = current === 'public' ? 'private' : 'public';
        const res = await fetch('/api/user/update-privacy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user: myData.user, privacy: newPrivacy })
        });
        if (res.ok) {
            // Update local storage if needed, but reloading is cleaner
            loadProfile();
        }
    }

    loadProfile();
</script>
</body>
</html>
