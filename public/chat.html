<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثة | Koliya Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a08; --panel: #0e0e0b; --gold: #c9a84c; --text: #f5f0e8; --border: rgba(201, 168, 76, 0.15); }
        body { background: var(--bg); color: var(--text); font-family: 'Amiri', serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        .chat-header { background: var(--panel); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 10; }
        .back-btn { background: none; border: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; padding: 0 10px; }
        .user-info h3 { margin: 0; font-size: 1.2rem; }
        .user-info span { font-size: 0.8rem; color: var(--gold); }

        /* Messages Area */
        #chatBox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 15px; font-size: 1rem; line-height: 1.4; position: relative; }
        .msg.sent { align-self: flex-start; background: var(--gold); color: #000; border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-end; background: #1a1a17; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; display: block; margin-top: 5px; text-align: left; }

        /* Input Area */
        .input-area { background: var(--panel); padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        input { flex: 1; background: #131310; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 25px; outline: none; font-family: 'Amiri'; }
        button { background: var(--gold); border: none; color: #000; width: 45px; height: 45px; border-radius: 50%; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1.2rem; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="chat-header">
        <button class="back-btn" onclick="location.href='inbox.html'">➔</button>
        <div class="user-info">
            <h3 id="targetName">جاري التحميل...</h3>
            <span id="targetUser">@username</span>
        </div>
    </div>

    <div id="chatBox">
        </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">➤</button>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const chatWith = urlParams.get('with'); // The person we are talking to
    const myData = JSON.parse(localStorage.getItem('userData'));

    if (!myData || !chatWith) window.location.href = 'index.html';

    async function loadProfile() {
        const res = await fetch(`/api/user/${chatWith}`);
        const user = await res.json();
        document.getElementById('targetName').innerText = user.name;
        document.getElementById('targetUser').innerText = `@${user.user}`;
    }

    async function fetchMessages() {
        const res = await fetch(`/api/messages/${myData.user}`);
        const allMsgs = await res.json();
        
        // Filter messages only between Me and Target
        const conversation = allMsgs.filter(m => 
            (m.from === myData.user && m.to === chatWith) || 
            (m.from === chatWith && m.to === myData.user)
        );

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = conversation.map(m => `
            <div class="msg ${m.from === myData.user ? 'sent' : 'received'}">
                ${m.text}
                <span class="msg-time">${new Date(m.time).toLocaleTimeString('ar-DZ', {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
        `).join('');
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function send() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;

        const res = await fetch('/api/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                from: myData.user,
                to: chatWith,
                text: text
            })
        });

        if (res.ok) {
            input.value = '';
            fetchMessages();
        }
    }

    // Initialize
    loadProfile();
    fetchMessages();
    // Poll for new messages every 3 seconds
    setInterval(fetchMessages, 3000);
</script>
</body>
</html>
