<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحادثة</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    .chat-header { padding: 15px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
    .back-btn { text-decoration: none; color: var(--gold); font-size: 1.2rem; }
    .partner-info { flex: 1; }
    .partner-name { font-weight: bold; display: block; }
    .partner-status { font-size: 0.75rem; color: #4ca87a; }

    .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 1rem; line-height: 1.4; position: relative; }
    .msg.sent { align-self: flex-start; background: var(--gold); color: #000; border-bottom-left-radius: 2px; }
    .msg.received { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 2px; }
    .msg-time { font-size: 0.65rem; opacity: 0.7; margin-top: 5px; display: block; text-align: left; }

    .input-area { padding: 15px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .input-area input { flex: 1; background: #1a1a17; border: 1px solid var(--border); border-radius: 25px; padding: 10px 20px; color: #fff; font-family: 'Amiri'; outline: none; }
    .btn-send { background: var(--gold); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="chat-header">
  <a href="inbox.html" class="back-btn">→</a>
  <div class="partner-info">
    <span class="partner-name" id="chatTitle">المستخدم</span>
    <span class="partner-status">متصل الآن</span>
  </div>
</div>

<div class="messages-area" id="msgBox">
  <div class="msg received">
    أهلاً بك! كيف يمكنني مساعدتك اليوم؟
    <span class="msg-time">09:00 AM</span>
  </div>
</div>

<div class="input-area">
  <input type="text" id="mInput" placeholder="اكتب رسالة...">
  <button class="btn-send" onclick="sendMsg()">🕊️</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const partner = params.get('u') || 'طالب';
  document.getElementById('chatTitle').innerText = partner;

  function sendMsg() {
    const input = document.getElementById('mInput');
    const text = input.value.trim();
    if(!text) return;

    const msgBox = document.getElementById('msgBox');
    const time = new Date().toLocaleTimeString('ar-DZ', {hour:'2-digit', minute:'2-digit'});
    
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg sent';
    msgDiv.innerHTML = `${text} <span class="msg-time">${time}</span>`;
    
    msgBox.appendChild(msgDiv);
    input.value = '';
    msgBox.scrollTop = msgBox.scrollHeight;
  }
</script>
</body>
</html>
