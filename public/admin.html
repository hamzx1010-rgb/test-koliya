<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>كلية — تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --cream: #f5f0e8; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: var(--cream); font-family: 'Amiri', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .auth-box { background: var(--bg2); border: 1px solid var(--border); padding: 30px; width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: var(--gold); text-align: center; margin-bottom: 25px; }
    input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #131310; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-family: 'Amiri'; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: var(--gold); border: none; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: 'Amiri'; }
    .hidden { display: none; }
    .toggle-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #888; cursor: pointer; }
    .toggle-link span { color: var(--gold); text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-box">
    <div id="loginView">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="lUser" placeholder="اسم المستخدم">
        <input type="password" id="lPass" placeholder="كلمة السر">
        <button class="btn" onclick="login()">دخول</button>
        <div class="toggle-link" onclick="toggleView(true)">ليس لديك حساب؟ <span>سجل الآن</span></div>
    </div>

    <div id="regView" class="hidden">
        <h2>تسجيل طالب جديد</h2>
        <input type="text" id="rCard" placeholder="رقم بطاقة الطالب">
        <select id="rWilaya">
            <option value="البليدة">البليدة</option>
            <option value="الجزائر">الجزائر</option>
            <option value="تيبازة">تيبازة</option>
        </select>
        <input type="text" id="rName" placeholder="الاسم الكامل">
        <input type="text" id="rUser" placeholder="اسم المستخدم">
        <input type="password" id="rPass" placeholder="كلمة السر">
        <button class="btn" onclick="register()">إرسال الطلب</button>
        <div class="toggle-link" onclick="toggleView(false)">لديك حساب؟ <span>سجل دخول</span></div>
    </div>
</div>

<script>
    function toggleView(showReg) {
        document.getElementById('loginView').classList.toggle('hidden', showReg);
        document.getElementById('regView').classList.toggle('hidden', !showReg);
    }

    async function login() {
        const user = document.getElementById('lUser').value;
        const pass = document.getElementById('lPass').value;
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user, pass })
        });
        const data = await res.json();
        if(data.success) {
            localStorage.setItem('userData', JSON.stringify(data.user));
            window.location.href = data.user.role === 'admin' ? 'admin.html' : 'feed.html';
        } else {
            alert(data.err || 'خطأ في بيانات الدخول');
        }
    }

    async function register() {
        const regData = {
            user: document.getElementById('rUser').value,
            pass: document.getElementById('rPass').value,
            name: document.getElementById('rName').value,
            wilaya: document.getElementById('rWilaya').value,
            cardId: document.getElementById('rCard').value
        };

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(regData)
        });

        if(res.ok) {
            alert('تم إرسال طلبك! يرجى انتظار تفعيل المدير لحسابك.');
            location.reload();
        } else {
            alert('فشل التسجيل. ربما اسم المستخدم محجوز.');
        }
    }
</script>
</body>
</html>
