<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة الإدارة المركزية</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg: #050505; --bg-card: #0e0e0b; --gold: #c9a84c; --green: #4ca87a; --border: rgba(201, 168, 76, 0.15); }
    body { background: var(--bg); color: #f5f0e8; font-family: 'Amiri', serif; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 12px; }
    h1 { color: var(--gold); margin-bottom: 20px; border-right: 4px solid var(--gold); padding-right: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { text-align: right; color: var(--gold); border-bottom: 2px solid var(--border); padding: 12px; }
    td { padding: 15px 12px; border-bottom: 1px solid var(--border); }
    .btn-approve { background: var(--green); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Amiri'; font-weight: bold; }
    .btn-approve:hover { opacity: 0.9; }
    .empty-msg { text-align: center; padding: 40px; color: #666; font-style: italic; }
  </style>
</head>
<body>

<div class="container">
    <h1>إدارة طلبات الالتحاق</h1>
    
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>الولاية</th>
                    <th>بطاقة الطالب</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="requestTable">
                </tbody>
        </table>
    </div>
</div>

<script>
    async function loadRequests() {
        try {
            const res = await fetch('/api/admin/data');
            const db = await res.json();
            const container = document.getElementById('requestTable');

            // Find users who are NOT active yet
            const pending = db.users.filter(u => u.status === 'pending');

            if (pending.length === 0) {
                container.innerHTML = '<tr><td colspan="4" class="empty-msg">لا توجد طلبات تفعيل معلقة حالياً</td></tr>';
                return;
            }

            container.innerHTML = pending.map(u => `
                <tr>
                    <td><b>${u.name}</b><br><small style="color:var(--gold)">@${u.user}</small></td>
                    <td>${u.wilaya}</td>
                    <td style="font-family:'Space Mono'">${u.cardId}</td>
                    <td>
                        <button class="btn-approve" onclick="approve('${u.user}')">تفعيل الحساب</button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            console.error("Fetch Error:", err);
        }
    }

    async function approve(username) {
        const res = await fetch('/api/admin/approve', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ targetUser: username })
        });
        
        if (res.ok) {
            loadRequests();
        } else {
            alert("حدث خطأ أثناء التفعيل");
        }
    }

    // Load on start
    loadRequests();
</script>
</body>
</html>
