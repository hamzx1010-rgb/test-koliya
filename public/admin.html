<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز القيادة | Koliya Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --panel: #0e0e0b; --gold: #c9a84c; --text: #f5f0e8; --border: rgba(201, 168, 76, 0.15); --red: #ff4444; --green: #4ca87a; }
        body { background: var(--bg); color: var(--text); font-family: 'Amiri', serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navigation */
        .sidebar { width: 280px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-header { text-align: center; color: var(--gold); font-size: 1.4rem; font-weight: bold; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; letter-spacing: 1px; }
        .nav-item { padding: 15px 25px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; border-right: 4px solid transparent; font-size: 1.1rem; }
        .nav-item:hover { background: rgba(201,168,76,0.05); color: var(--gold); }
        .nav-item.active { background: rgba(201,168,76,0.1); border-right: 4px solid var(--gold); color: var(--gold); }

        /* Content Area */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; background: linear-gradient(135deg, #050505 0%, #0a0a08 100%); }
        .command-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .live-indicator { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; background: var(--gold); color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; }

        /* Dashboard Elements */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; color: var(--gold); border-bottom: 2px solid var(--border); padding: 15px; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1rem; }
        
        /* Control Buttons */
        .btn { padding: 8px 18px; border-radius: 6px; cursor: pointer; border: none; font-family: 'Amiri'; font-weight: bold; transition: 0.2s; font-size: 0.9rem; }
        .btn-ok { background: var(--green); color: #fff; }
        .btn-no { background: var(--red); color: #fff; }
        .btn-warn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .hidden { display: none; }
        code { font-family: 'JetBrains Mono', monospace; color: var(--gold); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">COMMAND CENTER</div>
        <div class="nav-item active" onclick="switchTab('students', this)">👤 طلبات الالتحاق</div>
        <div class="nav-item" onclick="switchTab('posts', this)">📝 إدارة المحتوى</div>
        <div class="nav-item" onclick="switchTab('users', this)">🚫 إدارة الحظر</div>
        <div class="nav-item" onclick="switchTab('admins', this)">🛡️ أعضاء الإدارة</div>
        <div style="margin-top: auto; padding: 20px;">
            <button class="btn btn-warn" style="width: 100%;" onclick="location.href='feed.html'">العودة للموقع</button>
        </div>
    </div>

    <div class="main-content">
        
        <div id="tab-students">
            <div class="command-header">
                <h2>طلبات العضوية المعلقة</h2>
                <span class="live-indicator">SYSTEM_ACTIVE</span>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>الطالب</th>
                            <th>الولاية</th>
                            <th>رقم البطاقة</th>
                            <th>القرار</th>
                        </tr>
                    </thead>
                    <tbody id="pendingStudents"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-posts" class="hidden">
            <div class="command-header"><h2>الرقابة على المنشورات</h2></div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>الناشر</th>
                            <th>النص</th>
                            <th>التاريخ</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="postsList"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-users" class="hidden">
            <div class="command-header"><h2>قاعدة بيانات المستخدمين</h2></div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>المستخدم</th>
                            <th>الرتبة</th>
                            <th>الحالة</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="allUsersList"></tbody>
                </table>
            </div>
        </div>

    </div>

<script>
    // Tab Switching Logic
    function switchTab(id, el) {
        document.querySelectorAll('.main-content > div').forEach(div => div.classList.add('hidden'));
        document.getElementById('tab-' + id).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        el.classList.add('active');
        fetchCommandData();
    }

    // Core Data Fetching
    async function fetchCommandData() {
        try {
            const res = await fetch('/api/admin/data');
            const data = await res.json();
            renderStudents(data.users);
            renderPosts(data.posts);
            renderUserControl(data.users, data.banned || []);
        } catch (e) {
            console.error("Communication error with server.");
        }
    }

    function renderStudents(users) {
        const pending = users.filter(u => u.status === 'pending');
        document.getElementById('pendingStudents').innerHTML = pending.map(u => `
            <tr>
                <td><b>${u.name}</b><br><small>@${u.user}</small></td>
                <td>${u.wilaya}</td>
                <td><code>${u.cardId}</code></td>
                <td><button class="btn btn-ok" onclick="execute('approve', '${u.user}')">تفعيل الحساب</button></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center; opacity:0.5">لا توجد طلبات معلقة حالياً</td></tr>';
    }

    function renderPosts(posts) {
        document.getElementById('postsList').innerHTML = posts.map(p => `
            <tr>
                <td>@${p.author}</td>
                <td>${p.content.substring(0, 60)}...</td>
                <td>${new Date(p.id).toLocaleDateString('ar-DZ')}</td>
                <td><button class="btn btn-no" onclick="execute('deletePost', '${p.id}')">حذف</button></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center; opacity:0.5">لا توجد منشورات للمراجعة</td></tr>';
    }

    function renderUserControl(users, banned) {
        document.getElementById('allUsersList').innerHTML = users.map(u => `
            <tr>
                <td>${u.user}</td>
                <td>${u.role}</td>
                <td>${banned.includes(u.user) ? '<span style="color:var(--red)">محظور</span>' : 'نشط'}</td>
                <td>
                    ${banned.includes(u.user) 
                        ? `<button class="btn btn-ok" onclick="execute('unban', '${u.user}')">فك الحظر</button>`
                        : `<button class="btn btn-no" onclick="execute('ban', '${u.user}')">حظر المستخدم</button>`
                    }
                </td>
            </tr>
        `).join('');
    }

    async function execute(type, target) {
        const response = await fetch('/api/admin/action', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ type, target })
        });
        if (response.ok) fetchCommandData();
    }

    // Initialize
    window.onload = fetchCommandData;
    // Auto-refresh data every 10 seconds for real-time feel
    setInterval(fetchCommandData, 10000);
</script>
</body>
</html>
